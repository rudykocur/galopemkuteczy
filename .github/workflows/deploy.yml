name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          # GitHub Pages project sites live under /<repo-name>/ —
          # so asset and link paths resolve correctly.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Verify static output exists
        run: |
          if [ ! -d dist/client ]; then
            echo "dist/client missing — build output:" >&2
            ls -la dist || true
            exit 1
          fi
      # public/.nojekyll is committed, so it lands in dist/client automatically
      # (disables Jekyll processing on GitHub Pages).

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
