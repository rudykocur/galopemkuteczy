name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: |
          bun run build 2>&1 | tee /tmp/build.log
          # Prefer TanStack Start static client output; fall back to Nitro public dir.
          if [ -f dist/client/index.html ]; then OUT=dist/client
          elif [ -f .output/public/index.html ]; then OUT=.output/public
          else
            echo "::error::No static output with index.html found"
            ls -la dist .output .output/public || true
            exit 1
          fi
          mkdir -p _site && cp -r "$OUT"/. _site/
          touch _site/.nojekyll
          ls -la _site
        env:
          # Custom domain (galopemkuteczy.pl) serves from site root — asset URLs
          # must be /assets/..., not /<repo-name>/assets/...
          # For the github.io project URL without a custom domain, use /<repo>/ instead.
          VITE_BASE_PATH: /
      # public/.nojekyll (and CNAME) are copied into the static output.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
