name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: |
          bun run build 2>&1 | tee /tmp/build.log
          # Output folder differs by environment: dist/client (Lovable) or .output/public (GitHub runner)
          if [ -f dist/client/index.html ]; then OUT=dist/client
          elif [ -f .output/public/index.html ]; then OUT=.output/public
          else
            echo "::error::No static output with index.html found"
            ls -la dist .output .output/public || true
            exit 1
          fi
          mkdir -p _site && cp -r "$OUT"/. _site/
          touch _site/.nojekyll
          ls -la _site
        env:
          # GitHub Pages project sites live under /<repo-name>/ —
          # so asset and link paths resolve correctly.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # public/.nojekyll is committed, so it lands in dist/client automatically
      # (disables Jekyll processing on GitHub Pages).

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
